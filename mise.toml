[tools]
bun = "1.4.2"
uv = "0.12.19"

[settings]
auto_install = false

[tasks.install]
run = "bun install --frozen-lockfile"

[tasks.check]
run = "bunx biome check ."

[tasks.typecheck]
run = "bunx tsc --noEmit"

[tasks.test]
run = "bun test"

[tasks.smoke]
run = '''
bun -e '
const p = Bun.spawn(["omp", "--mode", "rpc", "--no-ui", "--no-session", "-e", "src/index.ts"], { stdin: "pipe", stdout: "pipe", stderr: "pipe" });
p.stdin.write(JSON.stringify({ id: "smoke", type: "get_state" }) + "\n");
p.stdin.end();
const [stdout, stderr, code] = await Promise.all([new Response(p.stdout).text(), new Response(p.stderr).text(), p.exited]);
const frames = stdout.trim().split("\n").map(line => JSON.parse(line));
if (code !== 0 || !frames.some(frame => frame.type === "ready") || !frames.some(frame => frame.type === "response" && frame.command === "get_state" && frame.success && JSON.stringify(frame.data?.systemPrompt).includes("xd://statify_read"))) {
  throw new Error(`OMP extension launch failed (exit ${code}): ${stderr.slice(0, 1000)}`);
}
console.log("OMP loaded statify_read through src/index.ts");
'
'''

[tasks."jeff:setup"]
description = "Install the pinned local Jeff server (experimental Jev alternative) with uv"
run = '''
set -eu
dir="${JEFF_DIR:-$HOME/.local/share/omp-statify/jeff}"
if [ -d "$dir/.git" ]; then git -C "$dir" fetch --quiet origin; else git clone --quiet https://github.com/firelex/jeff.git "$dir"; fi
git -C "$dir" checkout --quiet db4a13d8db0dc9bd84100b97498620b5f396e25c
cd "$dir"
uv python pin 3.14
uv sync --locked --no-default-groups --extra mac
uv run --no-sync hf download mstrasser/Jeff-Qwen3.5-0.8B --revision d66458d54426fcf52046b896261df8909bbc8b05 --local-dir checkpoints/jeff-0.8b
'''

[tasks."jeff:serve"]
description = "Run the local Jeff server (MLX, Jeff-Qwen3.5-0.8B) on 127.0.0.1:8765; set JEFF_PORT to change the port"
run = '''
cd "${JEFF_DIR:-$HOME/.local/share/omp-statify/jeff}"
JEFF_BACKEND=mlx JEFF_CHECKPOINT=checkpoints/jeff-0.8b JEFF_HOST=127.0.0.1 PORT="${JEFF_PORT:-8765}" exec uv run --no-sync jeff-serve
'''
